<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="container">
            <div id="conversion-section">
                <div id="coversion-unit">
                    <h2 id="coversion-title">Metric/Imperial Unit Conversion</h2>
                    <input id="metric-input"/>
                    <button id="metric-btn">Convert</button>
                </div>
            </div>
            <div id="metrics-conversion-info">
                <div id="length" class="conversion-info">
                    <p>Length (Meter/Feet)</p>
                    <div id="length-info"></div>
                </div>
                <div id="volume" class="conversion-info">
                    <p>Volume (Liters/Gallons)</p>
                    <div id="volume-info"></div>
                </div>
                <div id="mass" class="conversion-info">
                    <p>Mass (Kilograms/Pounds)</p>
                    <div id="mass-info"></div>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
